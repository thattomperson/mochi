name: "Multi-platform Export"
on: 
  push:
    branches: ['main']
  pull_request: 
    branches: ['main']

env:
 { GODOT_VERSION}: "4.3"

jobs:
  export-godot:
    runs-on: ubuntu-latest
    strategy:
      # If one platform fails, don't stop the others
      fail-fast: false
      matrix:
        platform: [linux, android, web, windows, mac]
        exclude:
          - platform: android  # Disabled for now
          - platform: windows  # Disabled for now
          - platform: mac      # Disabled for now

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Android builds require Java/JDK
      - name: Set up JDK 17 (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Decode the keystore from secrets
      - name: Decode Android Keystore
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Platform
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/{$GODOT_VERSION}-stable/Godot_{$GODOT_VERSION}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/{$GODOT_VERSION}-stable/Godot_{$GODOT_VERSION}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          # The 'preset' below must match your export_presets.cfg names
          # e.g., if your Android preset is named "Android", use matrix.platform
          # but capitalized. Most people just name their presets lowercase to match.
          export_preset: ${{ matrix.platform }}
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: /home/runner/.local/share/godot/builds/

  comment-pr:
    name: Comment on PR
    needs: [export-godot]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## 🏗️ Build Artifacts`,
              ``,
              `Build completed for commit \`${context.sha.substring(0, 7)}\`.`,
              `[Download](${runUrl}#artifacts) `
              ``,
              `> Artifacts are available for 14 days. Download from the [workflow run page](${runUrl}).`,
            ].join('\n');

            // Find existing bot comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Build Artifacts')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
