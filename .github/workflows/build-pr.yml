name: Build PR

on:
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  export-linux:
    name: Export Linux
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
            /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: godot --headless --import 2>&1 || true
        timeout-minutes: 2

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/mochi.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-linux
          path: build/linux/
          if-no-files-found: error
          retention-days: 14

  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
            /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: godot --headless --import 2>&1 || true
        timeout-minutes: 2

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  comment-pr:
    name: Comment on PR
    needs: [export-linux, export-web]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## 🏗️ Build Artifacts`,
              ``,
              `Build completed for commit \`${context.sha.substring(0, 7)}\`.`,
              ``,
              `| Platform | Download |`,
              `|----------|----------|`,
              `| Linux x86_64 | [mochi-linux](${runUrl}#artifacts) |`,
              `| Web (HTML5) | [mochi-web](${runUrl}#artifacts) |`,
              ``,
              `> Artifacts are available for 14 days. Download from the [workflow run page](${runUrl}).`,
            ].join('\n');

            // Find existing bot comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Build Artifacts')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
